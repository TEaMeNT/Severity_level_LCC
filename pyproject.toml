[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hara-lcc"
version = "1.0.0"
description = "ISO 26262-3 / SAE J2980:2023 HARA simulation and analytics for Lane Change Control (LCC / BSD) in CARLA + Scenic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
sim = [
    "carla>=0.9.14",
    "scenic>=3.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hara-lcc-run = "hara_lcc.simulation.campaign:main"
hara-lcc-analyze = "hara_lcc.analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
